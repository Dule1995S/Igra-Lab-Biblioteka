<!doctype html>
<html lang="sr-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="robots" content="noindex">
<style>
{{FONTS}}
{{CSS}}
</style>
</head>
<body>
<div id="viewport">
<div id="stage" data-theme="cream">
  <div id="bg"></div>
  <div id="scene"></div>
  <div id="bar" hidden>
    <div id="pills"></div>
    <button id="skipBtn" class="skip" hidden>прескочи ➜</button>

    <button id="fsBtn" class="round-btn" aria-label="Цео екран">

<div id="parents" hidden></div>
<div id="rotate">Окрени телефон водоравно за већу слику</div>
