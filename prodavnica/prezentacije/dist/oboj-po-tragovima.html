:root {
  --ink: #3a1a14;
  --brown: #9a4a30;
  --cream: #fff8ee;
  --orange: #ee5f45;
  --orange-dark: #c9462e;
  --card: #ffffff;
  --muted: #7a6a62;
  --ok: #4fa24a;
  --font: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--cream); font-family: var(--font); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 4px solid #2f6fd0; outline-offset: 3px; }
img { -webkit-user-drag: none; user-select: none; }

#viewport { position: fixed; inset: 0; overflow: hidden; contain: layout paint; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--cream); }
#bg { position: absolute; inset: 0; transition: background .5s; }
#scene { position: absolute; inset: 0; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }

/* pozadine */
#stage[data-theme="cream"] #bg { background: var(--cream); }
#stage[data-theme="day"] #bg { background: linear-gradient(#a6dcf0 0 66%, #7ab356 66% 100%); }
#stage[data-theme="knight"] #bg { background: linear-gradient(#fff3da, #ffe9c2); }
#stage[data-theme="night"] #bg {
  background:
    radial-gradient(2px 2px at 8% 20%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 22% 62%, #fff 50%, transparent 52%),
    radial-gradient(3px 3px at 34% 14%, #ffe9a8 50%, transparent 52%), radial-gradient(2px 2px at 47% 38%, #fff 50%, transparent 52%),
    radial-gradient(2px 2px at 58% 10%, #fff 50%, transparent 52%), radial-gradient(3px 3px at 71% 24%, #ffe9a8 50%, transparent 52%),
    radial-gradient(2px 2px at 86% 12%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 93% 48%, #fff 50%, transparent 52%),
    radial-gradient(2px 2px at 14% 84%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 64% 78%, #fff 50%, transparent 52%),
    linear-gradient(#1b2350, #3b3a78);
}
#stage[data-theme="dragon"] #bg { background: linear-gradient(#dff4e6 0 70%, #a9d98c 70% 100%); }
#stage[data-theme="treasure"] #bg { background: radial-gradient(circle at 50% 40%, #fff7dc, #ffe0a0); }
#stage[data-theme="tourney"] #bg { background: linear-gradient(#a6dcf0 0 62%, #8cc063 62% 100%); }
.cloud { position: absolute; width: 150px; height: 44px; background: #fff; border-radius: 40px; opacity: .9; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 64px; height: 64px; left: 22px; top: -30px; }
.cloud::after { width: 48px; height: 48px; left: 74px; top: -20px; }

/* gornja traka */
#bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 18px; z-index: 20; }
#bar[hidden] { display: none; }
#bar .logo { height: 40px; margin-right: 8px; }
#pills { display: flex; gap: 8px; flex: 1; }
.pill-step {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 0; border-radius: 12px; background: rgba(255,255,255,.92);
  border: 2px solid #d9cfc6; font-weight: 800; font-size: 14px; letter-spacing: .04em; color: #6b5d55; overflow: hidden;
}
.pill-step i { width: 8px; align-self: stretch; background: var(--c); }
.pill-step[data-state="now"] { border-color: var(--c); color: var(--ink); box-shadow: 0 3px 0 var(--c); }
.pill-step[data-state="done"] { color: var(--ink); }
.pill-step[data-state="done"]::after { content: "★"; color: #f2a60a; font-size: 16px; }
.pill-step[data-state="todo"] { opacity: .75; }
.pill-step:disabled { cursor: default; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.92); border: 2px solid #d9cfc6; display: grid; place-items: center; }
.round-btn svg { width: 22px; height: 22px; }
.skip { font-weight: 800; font-size: 14px; color: #6b5d55; background: rgba(255,255,255,.92); border: 2px solid #d9cfc6; border-radius: 12px; height: 36px; padding: 0 12px; }

/* Lisko i oblačić */
#lisko { position: absolute; left: 22px; bottom: 16px; width: 960px; height: 120px; display: flex; align-items: flex-end; gap: 14px; z-index: 15; pointer-events: none; }
#lisko[hidden] { display: none; }
#lisko .av { width: 112px; height: 112px; flex: none; border-radius: 50%; background: #fff; border: 4px solid var(--ink); display: grid; place-items: center; animation: bob 3s ease-in-out infinite; transform-origin: 50% 100%; margin-bottom: 4px; }
#lisko .av img { height: 84px; }
#bubble {
  position: relative; background: #fff; border: 4px solid var(--ink); border-radius: 22px; padding: 14px 20px; font-weight: 700; font-size: 23px; line-height: 1.3;
  max-width: 800px; min-height: 64px; box-shadow: 0 5px 0 rgba(58,26,20,.18); margin-bottom: 8px;
}
#bubble::before {
